version: 2
updates:
  # Keeps the actions in .github/workflows/ on supported versions. The
  # "operator:" prefix lets these commits pass the CI boundary guard.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "operator:"
  # Keeps the hash-pinned lint tool in .github/requirements-lint.txt current.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: monthly
    commit-message:
      prefix: "operator:"
